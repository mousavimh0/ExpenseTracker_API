name: CI

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        env:
            TEST_DATABASE_URL: postgresql+psycopg://expense_user:postgres@localhost:5432/expense_tracker_test

        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: expense_user
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: expense_tracker_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U expense_user -d expense_tracker_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Set up python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Run tests
              run: pytest
